name: Q-Zandronum Cooker CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-cooker:
    runs-on: ubuntu-latest
    # Using the official OpenMandriva Cooker container
    container: openmandriva/cooker

    steps:
    - name: Install git
      run: dnf install -y --nogpgcheck git-core
    
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        dnf install -y --nogpgcheck \
          cmake \
          gcc-c++ \
          ninja \
          python3 \
          lib64SDL-devel \
          lib64SDL2-devel \
          lib64SDL2_mixer-devel \
          lib64openal-devel \
          lib64sndfile-devel \
          lib64mpg123-devel \
          lib64fluidsynth-devel \
          lib64openssl-devel \
          lib64xcursor-devel \
          glib2-devel \
          pango-devel \
          cairo-devel \
          atk-devel \
          gdk-pixbuf2-devel

    - name: Build gtk2-ng
      run: |
        git clone https://git.devuan.org/Daemonratte/gtk2-ng.git /tmp/gtk2-ng-src
        mkdir -p /tmp/gtk2-ng-src/build
        cd /tmp/gtk2-ng-src/build
        # Installing to /opt to match your local 5800X3D layout
        cmake .. -DCMAKE_INSTALL_PREFIX=/opt/gtk2-ng -GNinja
        ninja install

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DNO_GTK=OFF \
          -DOpenGL_GL_PREFERENCE=GLVND \
          -DCMAKE_POLICY_DEFAULT_CMP0148=NEW \
          -DGTK2_GDKCONFIG_INCLUDE_DIR=/opt/gtk2-ng/lib/gtk-2.0/include \
          -DGTK2_GLIBCONFIG_INCLUDE_DIR=/opt/gtk2-ng/lib/glib-2.0/include

    - name: Build Engine
      run: ninja -C build






